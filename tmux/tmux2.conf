set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
setw -g aggressive-resize on
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
set -g status-position bottom
set -g status-style 'bg=#171B27 fg=#65737E'
set -g status-left-length 20
set -g status-right-length 50
set -g status-left '#[fg=#A3BE8C,bold] #S #{?window_zoomed_flag,#[fg=#F6C177][Z] ,}#[fg=#2B2E36]│ '
set -g status-right '#(for b in BAT0 BAT1 macsmc-battery; do f="/sys/class/power_supply/$b/capacity"; [ -f "$f" ] && echo "#[fg=#2B2E36]│#[fg=#B3B1AD] $(cat "$f")%% " && break; done)#[fg=#2B2E36]│#[fg=#B3B1AD] %H:%M #[fg=#2B2E36]│#[fg=#B3B1AD] %m/%d '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#A3BE8C,bold] #I:#W '
set -g pane-border-style 'fg=#2B2E36'
set -g pane-active-border-style 'fg=#A3BE8C'
set -g message-style 'bg=#F6C177 fg=#0F111B bold'
  
